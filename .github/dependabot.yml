# Weekly dependency updates, grouped so each ecosystem arrives as one pull request.
# Security updates still open immediately. CI runs on Node 24 (npm 11), the same npm Dependabot
# uses to write package-lock.json, so its lock files pass `npm ci`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # v5 renames the series API (addCandlestickSeries and friends). Migrate deliberately.
      - dependency-name: lightweight-charts
        update-types: [version-update:semver-major]
      # React 19, TypeScript 7 and Vite 8 (with plugin-react 6, which needs Vite 7+) each need a tested upgrade.
      # Vite 8 also swaps Rollup for Rolldown, whose native binaries Windows Smart App Control may block.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: "@vitejs/plugin-react"
        update-types: [version-update:semver-major]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # scipy 1.18 and numpy 2.5 need Python 3.12; setup.bat supports 3.11.
      - dependency-name: scipy
        versions: [">=1.18"]
      - dependency-name: numpy
        versions: [">=2.5"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
